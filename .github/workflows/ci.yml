name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    uses: Emerging-Patterns/actions/.github/workflows/nix-flake-check.yml@9523e8b294ae014fade5861c32d5ab911866acb2

  # The README's build, followed without nix on a fresh checkout, then the
  # proof gate. bend is the release flake.lock pins (bendlang/bend's flake
  # fetches this archive, with this sha256), not bend-lang.com/install.sh,
  # which installs whatever bend is newest.
  readme:
    runs-on: ubuntu-latest
    env:
      BEND_VERSION: 2.0.28
      BEND_SHA256: 22bb6d5f6bce8ae2c5b340371fedddcbd90edc07a48b6e2b351a944c4558a3eb
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install bend
        run: |
          archive="bend-${BEND_VERSION}-linux-x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/bendlang/bend/releases/download/v${BEND_VERSION}/$archive"
          echo "${BEND_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/bend/bin" >> "$GITHUB_PATH"
      - run: mkdir -p bin
      - run: bend examples/demo/main.bend -o bin/demo.bin
      - run: bin/demo.bin
      # the same demo on the JS lane, through the .js twins of the effects
      - run: bend examples/demo/main.bend
      # bend exits 0 when a proof leans on unsafe or foreign code, so the
      # gate is the first line, not the status
      - name: Proof gate
        run: |
          for p in $(git ls-files '*PROOF.bend'); do
            first=$(bend "$p" | head -n 1)
            echo "$p: $first"
            [ "$first" = "All terms check." ] || exit 1
          done
